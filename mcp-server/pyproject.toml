[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-codex-bridge-mcp"
dynamic = ["version"]
description = "BridgeNH MCP adapter for Minecraft 1.7.10 and GT New Horizons"
authors = [{name = "Goderium"}]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<0.29", "jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/Goderium/BridgeNH"

[project.scripts]
minecraft-codex-bridge = "minecraft_codex_bridge.frontend:main"
minecraft-codex-bridge-setup = "minecraft_codex_bridge.setup:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "minecraft_codex_bridge._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
minecraft_codex_bridge = ["guides/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

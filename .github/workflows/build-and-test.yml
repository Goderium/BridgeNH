name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Validated release version
        value: ${{ jobs.build.outputs.version }}
      prerelease:
        description: Whether the version is a prerelease
        value: ${{ jobs.build.outputs.prerelease }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Python test and packaging tools
        run: python -m pip install -e './mcp-server[test]' 'build>=1.2,<2'
      - name: Check versions and release tag
        id: metadata
        run: python scripts/release_metadata.py --github-output
      - name: Test MCP and Windows installer
        run: python -m pytest mcp-server/tests -q
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Build and test Forge mod
        run: .\gradlew.bat --no-daemon --console=plain build
      - name: Build Python packages
        run: python -m build --outdir build/dist mcp-server
      - name: Package and verify release assets
        run: python scripts/prepare_release.py
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridgenh-release
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14
